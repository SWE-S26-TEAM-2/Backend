name: Backend Perf (k6)

# Runs a 1-minute k6 smoke gate on every push to main/develop and on PRs.
# Long scenarios (load/stress/spike/soak/streaming/chat) are gated behind
# workflow_dispatch only - they take 15min-2h and are not free.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'tests/perf/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/perf-smoke.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - 'tests/perf/**'
  schedule:
    # Nightly smoke at 03:00 UTC so we get a daily latency baseline.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario file under tests/perf/scenarios (without .js)'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - load
          - stress
          - spike
          - soak
          - streaming
          - chat
      backend_url:
        description: 'Override BACKEND_URL (optional; default: spin up local)'
        required: false
        default: ''

jobs:
  perf-smoke:
    name: k6 ${{ github.event.inputs.scenario || 'smoke' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      SECRET_KEY: ci-test-secret-key
      GOOGLE_CLIENT_ID: ci-test-google-client-id
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Set up Python
        if: ${{ github.event.inputs.backend_url == '' || github.event.inputs.backend_url == null }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend deps
        if: ${{ github.event.inputs.backend_url == '' || github.event.inputs.backend_url == null }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install uvicorn

      - name: Start backend (docker compose if present, else uvicorn)
        if: ${{ github.event.inputs.backend_url == '' || github.event.inputs.backend_url == null }}
        run: |
          if [ -f docker-compose.yml ] || [ -f compose.yml ]; then
            echo "Starting via docker compose..."
            docker compose up -d --wait || docker compose up -d
          else
            echo "Starting via uvicorn..."
            alembic upgrade head
            nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 \
              > uvicorn.log 2>&1 &
            echo $! > uvicorn.pid
          fi

      - name: Wait for backend health
        if: ${{ github.event.inputs.backend_url == '' || github.event.inputs.backend_url == null }}
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/ >/dev/null 2>&1; then
              echo "backend up"
              exit 0
            fi
            sleep 1
          done
          echo "backend never came up" >&2
          tail -n 200 uvicorn.log 2>/dev/null || true
          exit 1

      - name: Seed perf data
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url || 'http://localhost:8000' }}
        run: |
          bash tests/perf/scripts/seed.sh || \
            echo "::warning::seed step failed; perf scenario may have reduced coverage"

      - name: Run k6 scenario
        env:
          BACKEND_URL: ${{ github.event.inputs.backend_url || 'http://localhost:8000' }}
        run: |
          SCENARIO="${{ github.event.inputs.scenario || 'smoke' }}"
          mkdir -p perf-artifacts
          k6 run \
            --summary-export=perf-artifacts/${SCENARIO}-summary.json \
            --out json=perf-artifacts/${SCENARIO}-raw.json \
            tests/perf/scenarios/${SCENARIO}.js

      - name: Upload k6 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ github.event.inputs.scenario || 'smoke' }}-${{ github.run_id }}
          path: |
            perf-artifacts/
            uvicorn.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop backend
        if: always() && (github.event.inputs.backend_url == '' || github.event.inputs.backend_url == null)
        run: |
          if [ -f uvicorn.pid ]; then kill "$(cat uvicorn.pid)" || true; fi
          docker compose down --remove-orphans 2>/dev/null || true
