name: Backend CD

on:
  workflow_run:
    workflows: [ "Backend CI" ]
    types: [ completed ]
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Deploy Backend to Azure VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          timeout: 300s
          command_timeout: 20m
          script: |
              cd ~/Backend
              git stash
              git pull
              git stash drop
            
              # Auto-stamp latest migration
              LATEST=$(ls ~/Backend/alembic/versions/*.py | xargs -I{} basename {} .py | cut -d_ -f1 | sort | tail -1)
              DB_URL=$(grep DATABASE_URL ~/DevOps/.env | cut -d= -f2-)
              docker run --rm python:3.11-slim bash -c "
              pip install psycopg2-binary -q &&
              python -c \"
              import psycopg2
              conn = psycopg2.connect('$DB_URL')
              cur = conn.cursor()
              cur.execute('DELETE FROM alembic_version;')
              cur.execute(\\\\\"INSERT INTO alembic_version (version_num) VALUES ('$LATEST');\\\\\")
              conn.commit()
              print('Stamped: $LATEST')
              cur.close()
              conn.close()
              \"
              " || true
            
              cd ~/DevOps
              docker compose stop backend
              docker compose build backend
              docker compose up -d backend
              sleep 10
              docker compose logs backend --tail=20
